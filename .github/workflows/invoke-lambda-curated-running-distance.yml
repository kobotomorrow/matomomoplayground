name: Invoke Curated Running Distance Lambda

on:
  schedule:
    - cron: '30 22 * * *' # JSTの07:30
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  invoke-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Run Lambda Function
        run: |
          aws lambda invoke \
            --function-name ${{ secrets.LAMBDA_CURATED_RUNNING_DISTANCE_FUNCTION_NAME }} \
            --payload '{}' \
            --cli-read-timeout 300 \
            /dev/null
