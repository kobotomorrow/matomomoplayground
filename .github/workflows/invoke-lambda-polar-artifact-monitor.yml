name: Invoke Polar Artifact Monitor Lambda

on:
  schedule:
    - cron: '0 22 * * *' # JSTの07:00
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  invoke-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Run Lambda Function
        run: |
          aws lambda invoke \
            --function-name ${{ secrets.LAMBDA_POLAR_ARTIFACT_MONITOR_FUNCTION_NAME }} \
            --payload '{}' \
            /dev/null
